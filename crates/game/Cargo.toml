[package]
name = "game"
description = "Клиент Skybound Corsairs на Bevy."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "skybound"
path = "src/main.rs"

[dependencies]
battle-core = { workspace = true }
game-data = { workspace = true }
bevy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bevy_brp_extras = { version = "=0.23.0", optional = true }

[features]
# Инструменты разработки: Bevy Remote Protocol, через который агент делает скриншоты и нажимает
# клавиши в запущенной игре (bevy_brp_mcp). В релизную сборку не входит:
# cargo build --release -p game --no-default-features
default = ["dev"]
dev = ["dep:bevy_brp_extras", "bevy/bevy_remote"]
