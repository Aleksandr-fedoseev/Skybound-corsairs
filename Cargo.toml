[workspace]
resolver = "3"
members = ["crates/battle-core", "crates/game-data", "crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
battle-core = { path = "crates/battle-core" }
game-data = { path = "crates/game-data" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Версия Bevy зафиксирована. Обновлять только отдельной задачей по migration guide.
bevy = { version = "=0.20.1", features = ["jpeg"] }

# Быстрая сборка своего кода и оптимизированные зависимости (Bevy медленный без оптимизаций).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
